name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries and conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            ffmpeg imagemagick librsvg2-bin pandoc poppler-utils ghostscript zip unzip p7zip-full \
            libreoffice-writer libreoffice-calc libreoffice-impress

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  cargo-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conversion tools
        run: |
          brew install ffmpeg imagemagick librsvg pandoc poppler ghostscript sevenzip
          brew install --cask libreoffice
          echo "/Applications/LibreOffice.app/Contents/MacOS" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
